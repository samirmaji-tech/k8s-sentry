name: ci

# Lint + test on every push/PR. Build & push to Azure Container Registry (ACR)
# only on pushes to main (and version tags), using GitHub OIDC — no long-lived
# Azure credentials in secrets.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Required for the OIDC token used to sign in to Azure (federated credential).
permissions:
  contents: read
  id-token: write

jobs:
  lint-test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check app tests

      - name: Run tests
        run: pytest -q

  build-push:
    name: Build & push image to ACR
    runs-on: ubuntu-latest
    needs: lint-test
    # Only publish images from the main branch or version tags, never from PRs.
    if: github.event_name == 'push'
    env:
      # Set ACR_NAME as a repository Variable (Settings → Secrets and variables →
      # Actions → Variables). Value is the registry name only, e.g. "acrsentry123"
      # (NOT the full login server).
      ACR_NAME: ${{ vars.ACR_NAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image with ACR Tasks
        # `az acr build` builds the image server-side in ACR and pushes it — no
        # local Docker/Buildx needed. The federated identity needs AcrPush on
        # the registry.
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "k8s-sentry:${GITHUB_SHA::7}" \
            --image "k8s-sentry:latest" \
            .
