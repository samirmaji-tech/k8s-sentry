# =====================================================================
# EXAMPLE secret — DO NOT COMMIT REAL VALUES.
#
# Recommended: create this from the CLI instead of a file so keys never
# land in git:
#
#   kubectl -n devops-lab create secret generic k8s-sentry-secrets \
#     --from-literal=ANTHROPIC_API_KEY="sk-ant-..." \
#     --from-literal=SLACK_WEBHOOK_URL="https://hooks.slack.com/services/..." \
#     --from-literal=ANTHROPIC_MODEL="claude-sonnet-4-5-20250929"
#
# For production, prefer External Secrets Operator or the AWS Secrets
# Manager CSI driver so secrets are never stored in etcd in plaintext.
# =====================================================================
apiVersion: v1
kind: Secret
metadata:
  name: k8s-sentry-secrets
  namespace: devops-lab
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "REPLACE_ME"
  ANTHROPIC_MODEL: "claude-sonnet-4-5-20250929"
  SLACK_WEBHOOK_URL: "REPLACE_ME"
  SLACK_ENABLED: "true"
