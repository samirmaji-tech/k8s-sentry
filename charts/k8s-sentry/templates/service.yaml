apiVersion: v1
kind: Service
metadata:
  name: {{ include "k8s-sentry.fullname" . }}
  namespace: {{ include "k8s-sentry.namespace" . }}
  labels:
    {{- include "k8s-sentry.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "k8s-sentry.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
