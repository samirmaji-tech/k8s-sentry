{{- if .Values.rbac.create }}
# Read-only ClusterRole: get/list/watch only. No write/exec verbs, Secrets excluded.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "k8s-sentry.fullname" . }}-readonly
  labels:
    {{- include "k8s-sentry.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services", "endpoints", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
{{- if eq .Values.rbac.scope "cluster" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "k8s-sentry.fullname" . }}-readonly
  labels:
    {{- include "k8s-sentry.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "k8s-sentry.fullname" . }}-readonly
subjects:
  - kind: ServiceAccount
    name: {{ include "k8s-sentry.serviceAccountName" . }}
    namespace: {{ include "k8s-sentry.namespace" . }}
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "k8s-sentry.fullname" . }}-readonly
  namespace: {{ include "k8s-sentry.namespace" . }}
  labels:
    {{- include "k8s-sentry.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "k8s-sentry.fullname" . }}-readonly
subjects:
  - kind: ServiceAccount
    name: {{ include "k8s-sentry.serviceAccountName" . }}
    namespace: {{ include "k8s-sentry.namespace" . }}
{{- end }}
{{- end }}
