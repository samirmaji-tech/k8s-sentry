apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "k8s-sentry.fullname" . }}-config
  namespace: {{ include "k8s-sentry.namespace" . }}
  labels:
    {{- include "k8s-sentry.labels" . | nindent 4 }}
data:
  TARGET_NAMESPACE: {{ .Values.config.targetNamespace | quote }}
  AGENT_MODE: {{ .Values.config.agentMode | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  LOG_TAIL_LINES: {{ .Values.config.logTailLines | quote }}
  ANTHROPIC_MODEL: {{ .Values.config.anthropicModel | quote }}
  SLACK_ENABLED: {{ .Values.config.slackEnabled | quote }}
  UNHEALTHY_REASONS: {{ .Values.config.unhealthyReasons | quote }}
